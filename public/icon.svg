<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond sombre arrondi -->
  <rect width="512" height="512" rx="96" fill="#06061a"/>

  <!-- Ombre/glow rouge derrière le losange -->
  <polygon points="256,48 464,256 256,464 48,256"
    fill="#cc0000" opacity="0.25"
    filter="url(#glow)"/>

  <!-- Losange rouge (enseigne tabac) -->
  <polygon points="256,52 460,256 256,460 52,256" fill="#cc0000"/>

  <!-- Losange intérieur légèrement plus clair pour effet volume -->
  <polygon points="256,80 432,256 256,432 80,256" fill="#e01111"/>

  <!-- Bord doré du losange -->
  <polygon points="256,52 460,256 256,460 52,256"
    fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.7"/>

  <!-- Ligne horizontale décorative -->
  <line x1="96" y1="256" x2="416" y2="256" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Texte TABAC -->
  <text x="256" y="243"
    text-anchor="middle"
    fill="white"
    font-family="Arial Black, 'Helvetica Neue', sans-serif"
    font-weight="900"
    font-size="88"
    letter-spacing="4"
    style="text-shadow: 0 2px 8px rgba(0,0,0,0.5)">TABAC</text>

  <!-- Petit texte FRANCE en dessous -->
  <text x="256" y="296"
    text-anchor="middle"
    fill="rgba(255,220,100,0.9)"
    font-family="Arial, sans-serif"
    font-weight="700"
    font-size="36"
    letter-spacing="10">FRANCE</text>

  <!-- Filtre glow -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
    </filter>
  </defs>
</svg>
